name: AI Job Researcher & Auto Deploy

on:
  # Schedule: Runs automatically twice daily at 03:00 and 15:00 UTC (8:00 AM & 8:00 PM Pakistan Time)
  schedule:
    - cron: '0 3,15 * * *'

  # Manual Trigger: Allows one-click execution from GitHub Actions tab
  workflow_dispatch:

  # Also deploy when manual changes are pushed to main
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'

# Permissions required to commit jobs and deploy to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "ai-jobs-and-pages"
  cancel-in-progress: false

jobs:
  # STEP 1: Research, Verify & Publish Jobs via Gemini AI
  research-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Gemini AI Job Research & Verification Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/fetch_and_publish_jobs.py

      - name: Commit & Push Verified Jobs
        run: |
          git config --global user.name "Rozgar Jawan AI Bot"
          git config --global user.email "ai-bot@rozgarjawan.pk"
          
          # Check if js/jobs.js has been modified
          if git diff --quiet js/jobs.js; then
            echo "No new jobs to commit."
          else
            echo "New jobs detected. Committing and pushing..."
            git add js/jobs.js
            git commit -m "🤖 [AI] Auto-published latest verified Pakistan jobs [skip ci]"
            git push origin main
          fi

  # STEP 2: Deploy to GitHub Pages
  deploy-pages:
    needs: research-and-publish
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Latest Code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
